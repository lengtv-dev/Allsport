<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYID3 - Ultra Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #DFD600;
            --bg-color: #0a0a0a; /* สีดำสนิทหรูหรา */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --sidebar-width: 350px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
        }

        /* --- 1. Login Page --- */
        #loginPage {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: var(--transition);
        }

        .login-card input:focus { border-color: var(--primary-color); background: rgba(255,255,255,0.1); }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-main:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* --- 2. Home Hub --- */
        #homeHub {
            display: none;
            min-height: 100vh;
            padding: 60px 20px;
            text-align: center;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 50px auto;
        }

        .hub-card {
            background: var(--glass-bg);
            padding: 50px 20px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .hub-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--primary-color);
            background: rgba(223, 214, 0, 0.05);
        }

        .hub-card i { font-size: 50px; display: block; margin-bottom: 20px; }

        /* --- 3. TV Interface --- */
        #tvApp { display: none; }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .channel-card {
            background: var(--glass-bg);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            cursor: pointer;
        }

        .channel-card:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        /* --- 4. Player & Sidebar --- */
        .player-container {
            display: none;
            flex-direction: row;
            height: 90vh;
            padding: 20px;
            gap: 20px;
        }

        .video-wrapper {
            flex: 1;
            background: #000;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            aspect-ratio: 16/9;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* Overlay Info */
        .video-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
        }

        .live-tag {
            background: #ff0000;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            animation: blink 1.5s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-list {
            overflow-y: auto;
            flex: 1;
            padding: 15px;
        }

        .side-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .side-item:hover { background: rgba(255,255,255,0.08); }

        .side-item.active {
            background: rgba(223, 214, 0, 0.15);
            border-color: var(--primary-color);
        }

        .side-item img {
            width: 50px; height: 50px; border-radius: 8px; margin-right: 15px;
            background: #222; object-fit: contain;
        }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; height: 400px; }
        }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="login-card">
            <h1 style="color: var(--primary-color); letter-spacing: 2px;">PLAYID3</h1>
            <p style="opacity: 0.7;">ENTER CREDENTIALS</p>
            <input type="text" id="user_email" placeholder="Username" value="0647804735">
            <input type="password" id="user_pass" placeholder="Password" value="12345">
            <button class="btn-main" onclick="handleLogin()">เข้าสู่ระบบ</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 13px; display: none; margin-top: 15px;">ข้อมูลการเข้าสู่ระบบไม่ถูกต้อง</p>
        </div>
    </div>

    <div id="homeHub">
        <h1 style="font-size: 40px;">สวัสดี, <span style="color: var(--primary-color);">ยินดีต้อนรับ</span></h1>
        <p style="opacity: 0.6;">เลือกบริการที่ต้องการรับชม</p>
        <div class="hub-grid">
            <div class="hub-card" onclick="showTVApp()">
                <span>📺</span>
                <h2>LIVE TV</h2>
                <p>ช่องรายการสดทั่วโลก</p>
            </div>
            <div class="hub-card" onclick="alert('ระบบหนังกำลังปรับปรุง...')">
                <span>🎬</span>
                <h2>MOVIES</h2>
                <p>หนังดังระดับโลก</p>
            </div>
            <div class="hub-card" onclick="alert('ระบบซีรีส์กำลังปรับปรุง...')">
                <span>🍿</span>
                <h2>SERIES</h2>
                <p>ซีรีส์ยอดฮิต</p>
            </div>
        </div>
    </div>

    <div id="tvApp">
        <header>
            <h2 style="color: var(--primary-color);">PLAYID3 TV</h2>
            <button onclick="backToHub()" style="background:none; border: 1px solid #444; color:white; padding:8px 15px; border-radius:10px; cursor:pointer;">← กลับหน้าหลัก</button>
        </header>

        <div id="catGrid" class="grid-layout"></div>

        <div id="playerView" class="player-container">
            <div class="video-wrapper">
                <div class="video-overlay" id="overlay">
                    <div class="live-tag">● LIVE</div>
                    <div id="chNameOverlay" style="font-size: 28px; font-weight: 600; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Channel Name</div>
                </div>
                <video id="videoPlayer" controls autoplay></video>
            </div>

            <aside class="sidebar">
                <div style="padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between;">
                    <span style="font-weight: 600;">PLAYLIST</span>
                    <button onclick="closePlayer()" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">ปิด X</button>
                </div>
                <div id="sidePlaylist" class="sidebar-list"></div>
            </aside>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    let session = "";
    let hls = null;

    // --- ดึงข้อมูลจากไฟล์เดิมของคุณมาใส่ตรงนี้ ---
    const categories = [
        { name: '⚽ SPORTS', channels: [0, 1, 2, 3, 4] },
        { name: '📽️ MOVIES', channels: [36, 37, 38] },
        { name: '📚 NEWS', channels: [72, 73] }
    ];

    const channelNames = { 0: 'MAX 1', 1: 'MAX 2', 2: 'MAX 3', 3: 'MAX 4', 4: 'MAX 5', 36: 'AXN', 37: 'T-Film', 72: 'News 1', 73: 'News 2' };
    const channelLogos = { 0: 'https://images.streamx2.cc/images/tv/png/streamx-max01-hd.png' }; 

    // ระบบ Login
    async function handleLogin() {
        const u = document.getElementById('user_email').value;
        const p = document.getElementById('user_pass').value;
        try {
            const res = await fetch(`https://streamx-web.cc/api/user/login/?user_email=${u}&user_password=${p}&kauth=`);
            const data = await res.text();
            const match = data.match(/<user_loggedsession>(.*?)<\/user_loggedsession>/);
            if(match) {
                session = match[1];
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('homeHub').style.display = 'block';
            } else { throw new Error(); }
        } catch(e) {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    // ระบบจัดการหน้าจอ
    function backToHub() {
        document.getElementById('tvApp').style.display = 'none';
        document.getElementById('homeHub').style.display = 'block';
    }

    function showTVApp() {
        document.getElementById('homeHub').style.display = 'none';
        document.getElementById('tvApp').style.display = 'block';
        renderCategories();
    }

    function renderCategories() {
        const grid = document.getElementById('catGrid');
        grid.style.display = 'grid';
        document.getElementById('playerView').style.display = 'none';
        grid.innerHTML = categories.map((cat, idx) => `
            <div class="channel-card" onclick="openCategory(${idx})">
                <div style="font-size:40px; margin-bottom:10px;">📺</div>
                <div style="font-weight:600;">${cat.name}</div>
                <div style="font-size:12px; opacity:0.5;">${cat.channels.length} ช่อง</div>
            </div>
        `).join('');
    }

    function openCategory(idx) {
        document.getElementById('catGrid').style.display = 'none';
        document.getElementById('playerView').style.display = 'flex';
        
        const cat = categories[idx];
        const list = document.getElementById('sidePlaylist');
        list.innerHTML = cat.channels.map(chIdx => `
            <div class="side-item" id="side-${chIdx}" onclick="playChannel(${chIdx})">
                <img src="${channelLogos[chIdx] || 'https://via.placeholder.com/50'}" />
                <div>
                    <div style="font-size:14px; font-weight:600;">${channelNames[chIdx]}</div>
                    <div style="font-size:11px; color:var(--primary-color);">HD STREAM</div>
                </div>
            </div>
        `).join('');

        playChannel(cat.channels[0]); // เล่นช่องแรกอัตโนมัติ
    }

    async function playChannel(chIdx) {
        // Highlight Sidebar
        document.querySelectorAll('.side-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`side-${chIdx}`)?.classList.add('active');
        
        // Update Overlay
        document.getElementById('chNameOverlay').innerText = channelNames[chIdx];

        // ในส่วนนี้คุณต้องเพิ่ม Logic การดึง URL (Fetch clear_url) เหมือนโค้ดเดิมของคุณ
        // ตัวอย่างการเรียกใช้:
        // const playUrl = `https://streamx-web.cc/api/tv/channels/play/?c=CH_ID&user_loggedsession=${session}`;
        // fetch และนำ m3u8 ไปใส่ใน hls.js
        console.log("กำลังเล่นช่อง:", channelNames[chIdx]);
    }

    function closePlayer() {
        if(hls) hls.stopLoad();
        document.getElementById('videoPlayer').pause();
        renderCategories();
    }
</script>
</body>
</html>
