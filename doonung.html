<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doo-Nang Movie Parser & M3U Generator</title>
  <style>
    :root { --primary: #5FBE00; --dark: #1a1a1a; --gray: #333; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: var(--primary); text-align: center; margin-bottom: 30px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid var(--gray); background: #222; color: #fff; font-size: 16px; }
    button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    #fetchBtn { background: var(--primary); color: #000; }
    #fetchBtn:hover { background: #4da300; transform: translateY(-2px); }
    .download-btn { background: #0078d7; color: #fff; margin-top: 10px; display: none; }
    pre { background: #000; color: #5FBE00; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; max-height: 400px; border: 1px solid var(--gray); }
    .section-title { margin-top: 30px; border-left: 4px solid var(--primary); padding-left: 10px; color: var(--primary); }
    .loader { display: none; text-align: center; margin: 20px 0; color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>Doo-Nang Movie Parser</h1>
  
  <div class="input-group">
    <input id="movieId" type="number" placeholder="ใส่ Movie ID (เช่น 1234)">
    <button id="fetchBtn">ดึงข้อมูลและสร้าง M3U</button>
  </div>

  <div id="loader" class="loader">⏳ กำลังประมวลผลข้อมูล...</div>

  <div id="resultArea" style="display: none;">
    <button id="downloadBtn" class="download-btn">📥 ดาวน์โหลดไฟล์ .m3u</button>
    
    <h3 class="section-title">M3U Playlist Content</h3>
    <pre id="m3uOutput"></pre>

    <h3 class="section-title">JSON Raw Data</h3>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<script>
const nationMap = {
  TH: "ภาพยนตร์ ไทย", KR: "ภาพยนตร์ เกาหลี", JP: "ภาพยนตร์ ญี่ปุ่น", IN: "ภาพยนตร์ อินเดีย",
  US: "ภาพยนตร์ สหรัฐอเมริกา", CA: "ภาพยนตร์ แคนาดา", CN: "ภาพยนตร์ จีน", FR: "ภาพยนตร์ ฝรั่งเศส",
  GB: "ภาพยนตร์ อังกฤษ", MY: "ภาพยนตร์ มาเลเซีย", ES: "ภาพยนตร์ สเปน", PH: "ภาพยนตร์ ฟิลิปปินส์",
  IE: "ภาพยนตร์ ไอร์แลนด์", ID: "ภาพยนตร์ อินโดนีเซีย"
};

async function checkSubtitleExists(url) {
  try {
    const res = await fetch(url, { method: 'HEAD' });
    return res.ok;
  } catch {
    return false;
  }
}

function parseMasterPlaylist(m3u8Text, baseUrl) {
  const audioTracks = [];
  const videoStreams = [];

  const audioRegex = /#EXT-X-MEDIA:TYPE=AUDIO.*?(?:NAME="([^"]+)")?.*?(?:LANGUAGE="([^"]+)")?.*?URI="([^"]+)"/g;
  let audioMatch;
  while ((audioMatch = audioRegex.exec(m3u8Text)) !== null) {
    const [, name, language, uri] = audioMatch;
    audioTracks.push({
      name: name || language || "Unknown",
      language: language || "unknown",
      src: uri.startsWith("http") ? uri : `${baseUrl}/${uri}`
    });
  }

  const streamRegex = /#EXT-X-STREAM-INF:(?:.*RESOLUTION=(\d+x\d+))?.*?\n([^\n\r]+)/g;
  let streamMatch;
  while ((streamMatch = streamRegex.exec(m3u8Text)) !== null) {
    const [, resolution, uri] = streamMatch;
    videoStreams.push({
      resolution: resolution || "Auto",
      src: uri.startsWith("http") ? uri : `${baseUrl}/${uri}`
    });
  }

  return { audioTracks, videoStreams };
}

async function fetchMovieById(movieId) {
  const query = `
    query getMovie($id: Int!) {
      movie(id: $id) {
        id titleTh titleEn descriptionTh synopsisTh releaseDate posterUrl imdbRating slug nation
        genres { name slug }
        video { transcodeUuid cdnHostname }
      }
    }
  `;

  const response = await fetch('https://api.doo-nang.com/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, operationName: 'getMovie', variables: { id: movieId } })
  });

  const result = await response.json();
  const movie = result?.data?.movie;
  if (!movie) {
    throw new Error("❌ ไม่พบข้อมูลภาพยนตร์ ID: " + movieId);
  }

  const genres = movie.genres?.map(g => g.name) || [];
  const imdbRating = movie.imdbRating || '0.0';
  const plot = movie.descriptionTh?.trim() || movie.synopsisTh?.trim() || '-';
  const year = movie.releaseDate?.substring(0, 4) || '0000';
  const category = nationMap[movie.nation] || "ภาพยนตร์ ทั่วไป";

  const transcodeUuid = movie.video?.transcodeUuid;
  const cdnHostname = movie.video?.cdnHostname;
  const subtitle = [];
  let audioTracks = [];
  let videoStreams = [];
  let playlistUrl = "";

  if (transcodeUuid && cdnHostname) {
    const base = `https://${cdnHostname}/${transcodeUuid}`;
    playlistUrl = `https://api.doo-nang.com/video/${transcodeUuid}/playlist.m3u8`;

    const subtitleVariants = [
      { lang: "th", codec: "VTT", src: `${base}/sub_tha.vtt` },
      { lang: "th", codec: "BDN", src: `${base}/sub_tha/index.xml` }
    ];
    for (const sub of subtitleVariants) {
      if (await checkSubtitleExists(sub.src)) subtitle.push(sub);
    }

    try {
      const res = await fetch(playlistUrl);
      if (res.ok) {
        const m3u8Text = await res.text();
        const baseUrl = playlistUrl.substring(0, playlistUrl.lastIndexOf('/'));
        const parsedData = parseMasterPlaylist(m3u8Text, baseUrl);
        
        audioTracks = parsedData.audioTracks;
        videoStreams = parsedData.videoStreams;
      }
    } catch (e) {
      console.warn("ไม่สามารถโหลด playlist.m3u8 ได้", e);
    }
  }

  return {
    id: movie.id,
    name: movie.titleTh || movie.titleEn,
    fullName: `${movie.titleEn || movie.titleTh} - ${movie.titleTh || movie.titleEn}`,
    category,
    info: {
      poster: movie.posterUrl,
      genre: genres,
      plot,
      rating: imdbRating,
      year
    },
    playlist: playlistUrl,
    videoStreams,
    audioTracks,
    subtitle
  };
}

function generateM3U(movieData) {
  let m3u = "#EXTM3U\n";
  if (movieData.playlist) {
    m3u += `#EXTINF:-1 type="movie" group-title="${movieData.category}" tvg-logo="${movieData.info.poster}", ${movieData.name} (${movieData.info.year})\n`;
    m3u += `${movieData.playlist}\n`;
  }
  return m3u;
}

document.getElementById("fetchBtn").addEventListener("click", async () => {
  const idInput = document.getElementById("movieId").value;
  const id = parseInt(idInput, 10);
  const loader = document.getElementById("loader");
  const resultArea = document.getElementById("resultArea");

  if (!id) return alert("กรุณาใส่ Movie ID");

  loader.style.display = "block";
  resultArea.style.display = "none";

  try {
    const data = await fetchMovieById(id);
    const m3u = generateM3U(data);

    document.getElementById("m3uOutput").textContent = m3u;
    document.getElementById("jsonOutput").textContent = JSON.stringify(data, null, 2);

    const downloadBtn = document.getElementById("downloadBtn");
    downloadBtn.style.display = "block";
    downloadBtn.onclick = () => {
      const blob = new Blob([m3u], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${data.name.replace(/\s+/g, '_')}_${data.id}.m3u`;
      a.click();
    };

    resultArea.style.display = "block";
  } catch (err) {
    alert(err.message);
  } finally {
    loader.style.display = "none";
  }
});
</script>
</body>
</html>
