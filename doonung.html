<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doo-Nang All-in-One Parser (Select Box)</title>
  <style>
    :root { --primary: #5FBE00; --dark: #1a1a1a; --gray: #333; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: var(--primary); text-align: center; margin-bottom: 25px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--gray); padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { background: #222; color: #ccc; border: 1px solid var(--gray); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; }
    select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--gray); background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
    button.action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--primary); color: #000; transition: 0.3s; margin-top: 10px; font-size: 16px; }
    button.action-btn:hover { background: #4da300; }
    .download-btn { background: #0078d7; color: #fff; margin-top: 10px; display: none; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    pre { background: #000; color: #5FBE00; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; max-height: 400px; border: 1px solid var(--gray); }
    .section-title { margin-top: 30px; border-left: 4px solid var(--primary); padding-left: 10px; color: var(--primary); }
    .loader { display: none; text-align: center; margin: 20px 0; color: var(--primary); font-weight: bold; }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <h1>Doo-Nang All-in-One Parser</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('serie-tag')">หมวดซีรีส์ (เลือก/วาง URL)</button>
    <button class="tab-btn" onclick="switchMode('series-id')">ซีรีส์ (ID)</button>
    <button class="tab-btn" onclick="switchMode('movie-id')">หนัง (ID)</button>
  </div>
  
  <!-- Panel หมวดซีรีส์ -->
  <div id="panel-serie-tag" class="mode-panel active">
    <div class="form-group">
      <label>1. เลือกหมวดหมู่สำเร็จรูป:</label>
      <select id="sTagSelect" onchange="syncSerieInput()">
        <option value="">-- หรือเลือกหมวดหมู่ที่นี่ --</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=viu&title=ซีรีส์%20Viu">ซีรีส์ Viu</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=netflix&title=ซีรีส์%20Netflix">ซีรีส์ Netflix</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=disney&title=ซีรีส์%20Disney%20Plus">ซีรีส์ Disney Plus</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=hbo&title=ซีรีส์%20HBO">ซีรีส์ HBO</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=เกาหลี&title=ซีรีส์%20เกาหลี">ซีรีส์ เกาหลี</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=thailand&title=ซีรีส์%20ไทย">ซีรีส์ ไทย</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-genre&value=หนังชีวิต&title=ซีรีส์ดราม่า">ซีรีส์ ดราม่า/หนังชีวิต</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=serie-tag&value=การ์ตูน&title=ซีรีส์การ์ตูน">ซีรีส์ การ์ตูน</option>
        <option value="https://www.doo-nang.com/ดูหนังออนไลน์/list?type=content&value=series&title=ซีรีส์">ซีรีส์ ทั้งหมด</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>2. หรือวาง URL เอง:</label>
      <input id="sTagValue" type="text" placeholder="วาง URL ซีรีส์ที่นี่...">
    </div>

    <button class="action-btn" onclick="handleFetchSeriesByTag()">ดึงข้อมูลซีรีส์</button>
  </div>

  <!-- Panel Series ID -->
  <div id="panel-series-id" class="mode-panel">
    <div class="form-group">
      <input id="showId" type="number" placeholder="ใส่ Show ID ซีรีส์ (เช่น 1234)">
    </div>
    <button class="action-btn" onclick="handleFetchSeriesById()">ดึงข้อมูลซีรีส์</button>
  </div>

  <!-- Panel Movie ID -->
  <div id="panel-movie-id" class="mode-panel">
    <div class="form-group">
      <input id="movieId" type="number" placeholder="ใส่ Movie ID หนัง (เช่น 1234)">
    </div>
    <button class="action-btn" onclick="handleFetchMovieById()">ดึงข้อมูลหนัง</button>
  </div>

  <div id="loader" class="loader">⏳ กำลังประมวลผลข้อมูลซีรีส์และค้นหาลิงก์วิดีโอ...</div>

  <div id="resultArea" style="display: none;">
    <button id="downloadBtn" class="download-btn">📥 ดาวน์โหลดไฟล์ .m3u</button>
    <h3 class="section-title">M3U Playlist Content</h3>
    <pre id="m3uOutput"></pre>
    <h3 class="section-title">JSON Raw Data</h3>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<script>
function switchMode(mode) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${mode}`).classList.add('active');
  event.target.classList.add('active');
}

function syncSerieInput() {
  const selectVal = document.getElementById("sTagSelect").value;
  if (selectVal) {
    document.getElementById("sTagValue").value = selectVal;
  }
}

function parseUrl(str) {
  try { return new URL(str); } catch { return null; }
}

async function fetchSeriesById(showId) {
  const query = `
    query getShow($id: Int!) {
      show(id: $id) {
        id titleTh titleEn nation posterUrl
        episodes {
          seasonNo episodeNo titleTh titleEn
          video { transcodeUuid }
        }
      }
    }
  `;
  const res = await fetch("https://api.doo-nang.com/graphql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables: { id: parseInt(showId, 10) } })
  });
  const result = await res.json();
  return result?.data?.show;
}

async function handleFetchSeriesByTag() {
  const input = document.getElementById("sTagValue").value.trim();
  if (!input) return alert("กรุณาเลือกหมวดหมู่ หรือวาง URL");

  showLoader(true);
  try {
    const urlObj = parseUrl(input);
    let type = "serie-tag";
    let val = input;

    if (urlObj) {
      type = urlObj.searchParams.get("type") || "serie-tag";
      val = decodeURIComponent(urlObj.searchParams.get("value") || "");
    }

    let whereCondition = {};
    if (type === "content") {
      whereCondition = {};
    } else if (type === "serie-genre") {
      whereCondition = { genres: { some: { name: { equals: val } } } };
    } else {
      whereCondition = { tags: { some: { name: { equals: val } } } };
    }

    const query = `
      query getShows($skip: Int!, $take: Int!, $where: ShowWhereInput) {
        shows(skip: $skip, take: $take, where: $where, orderBy: {createdAt: desc}) {
          items { id titleTh titleEn posterUrl }
        }
      }
    `;

    const res = await fetch('https://api.doo-nang.com/graphql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, operationName: 'getShows', variables: { skip: 0, take: 30, where: whereCondition } })
    });

    const data = await res.json();
    const shows = data?.data?.shows?.items || [];

    if (shows.length === 0) throw new Error("ไม่พบรายการซีรีส์ในหมวดหมู่นี้");

    const fullSeriesList = [];
    for (const item of shows) {
      const detailedShow = await fetchSeriesById(item.id);
      if (detailedShow && detailedShow.episodes) {
        fullSeriesList.push(detailedShow);
      }
    }

    renderSeriesResult(fullSeriesList, `Series_${val || 'List'}`);
  } catch (e) {
    alert(e.message || "เกิดข้อผิดพลาดในการดึงข้อมูล");
  } finally {
    showLoader(false);
  }
}

function renderSeriesResult(shows, filename) {
  let m3u = "#EXTM3U\n";
  const jsonList = [];

  shows.forEach(show => {
    const showTitle = show.titleTh || show.titleEn;
    const logo = show.posterUrl || "";

    (show.episodes || []).forEach(ep => {
      const uuid = ep.video?.transcodeUuid;
      if (uuid) {
        const playUrl = `https://api.doo-nang.com/video/${uuid}/playlist.m3u8`;
        const sNo = String(ep.seasonNo || 1).padStart(2, '0');
        const eNo = String(ep.episodeNo || 1).padStart(2, '0');
        const epTitle = ep.titleTh || ep.titleEn || `EP${ep.episodeNo}`;

        m3u += `#EXTINF:-1 type="series" group-title="${showTitle}" tvg-logo="${logo}" tvg-season="${ep.seasonNo || 1}" tvg-episode="${ep.episodeNo}", ${showTitle} S${sNo}E${E} - ${epTitle}\n`;
        m3u += `${playUrl}\n`;

        jsonList.push({ showId: show.id, showTitle, season: ep.seasonNo || 1, episode: ep.episodeNo, epTitle, playlist: playUrl });
      }
    });
  });

  document.getElementById("m3uOutput").textContent = m3u;
  document.getElementById("jsonOutput").textContent = JSON.stringify(jsonList, null, 2);

  const btn = document.getElementById("downloadBtn");
  btn.style.display = "block";
  btn.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([m3u], { type: 'text/plain' }));
    a.download = `${filename.replace(/\s+/g, '_')}.m3u`;
    a.click();
  };

  document.getElementById("resultArea").style.display = "block";
}

async function handleFetchSeriesById() {
  const id = document.getElementById("showId").value;
  if (!id) return alert("กรุณาใส่ Show ID");
  showLoader(true);
  try {
    const show = await fetchSeriesById(id);
    if (!show) throw new Error("ไม่พบซีรีส์ ID นี้");
    renderSeriesResult([show], `Series_${id}`);
  } catch (e) { alert(e.message); }
  finally { showLoader(false); }
}

function showLoader(s) {
  document.getElementById("loader").style.display = s ? "block" : "none";
  if (s) document.getElementById("resultArea").style.display = "none";
}
</script>
</body>
</html>
