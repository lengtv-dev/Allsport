<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doo-Nang All-in-One Parser (Fixed)</title>
  <style>
    :root { --primary: #5FBE00; --dark: #1a1a1a; --gray: #333; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: var(--primary); text-align: center; margin-bottom: 25px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--gray); padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { background: #222; color: #ccc; border: 1px solid var(--gray); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid var(--gray); background: #222; color: #fff; font-size: 16px; }
    button.action-btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--primary); color: #000; transition: 0.3s; }
    button.action-btn:hover { background: #4da300; }
    .download-btn { background: #0078d7; color: #fff; margin-top: 10px; display: none; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    pre { background: #000; color: #5FBE00; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; max-height: 400px; border: 1px solid var(--gray); }
    .section-title { margin-top: 30px; border-left: 4px solid var(--primary); padding-left: 10px; color: var(--primary); }
    .loader { display: none; text-align: center; margin: 20px 0; color: var(--primary); font-weight: bold; }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <h1>Doo-Nang All-in-One Parser</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('movie-id')">หนัง (ID)</button>
    <button class="tab-btn" onclick="switchMode('series-id')">ซีรีส์ (ID)</button>
    <button class="tab-btn" onclick="switchMode('movie-tag')">หมวดหนัง</button>
    <button class="tab-btn" onclick="switchMode('serie-tag')">หมวดซีรีส์ / URL</button>
  </div>
  
  <div id="panel-movie-id" class="mode-panel active"><div class="input-group"><input id="movieId" type="number" placeholder="ใส่ Movie ID (เช่น 1234)"><button class="action-btn" onclick="handleFetchMovieById()">ดึงข้อมูล</button></div></div>
  <div id="panel-series-id" class="mode-panel"><div class="input-group"><input id="showId" type="number" placeholder="ใส่ Show ID ซีรีส์ (เช่น 1234)"><button class="action-btn" onclick="handleFetchSeriesById()">ดึงข้อมูล</button></div></div>
  <div id="panel-movie-tag" class="mode-panel"><div class="input-group"><input id="mTagValue" type="text" placeholder="ใส่ Tag หนัง หรือวาง URL"><button class="action-btn" onclick="handleFetchMovieByTag()">ดึงหนัง</button></div></div>
  <div id="panel-serie-tag" class="mode-panel"><div class="input-group"><input id="sTagValue" type="text" placeholder="วาง URL ซีรีส์ที่นี่ (เช่น https://www.doo-nang.com/...)"><button class="action-btn" onclick="handleFetchSeriesByTag()">ดึงซีรีส์</button></div></div>

  <div id="loader" class="loader">⏳ กำลังประมวลผลข้อมูลซีรีส์และค้นหาลิงก์วิดีโอ...</div>

  <div id="resultArea" style="display: none;">
    <button id="downloadBtn" class="download-btn">📥 ดาวน์โหลดไฟล์ .m3u</button>
    <h3 class="section-title">M3U Playlist Content</h3>
    <pre id="m3uOutput"></pre>
    <h3 class="section-title">JSON Raw Data</h3>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<script>
const nationMap = { TH: "ซีรีส์ ไทย", KR: "ซีรีส์ เกาหลี", JP: "ซีรีส์ ญี่ปุ่น", US: "ซีรีส์ สหรัฐอเมริกา", CN: "ซีรีส์ จีน" };

function switchMode(mode) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${mode}`).classList.add('active');
  event.target.classList.add('active');
}

function parseUrl(str) {
  try {
    return new URL(str);
  } catch {
    return null;
  }
}

// 1. ดึงซีรีส์จาก ID รายเรื่อง
async function fetchSeriesById(showId) {
  const query = `
    query getShow($id: Int!) {
      show(id: $id) {
        id titleTh titleEn nation posterUrl
        episodes {
          seasonNo episodeNo titleTh titleEn
          video { transcodeUuid }
        }
      }
    }
  `;
  const res = await fetch("https://api.doo-nang.com/graphql", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables: { id: parseInt(showId, 10) } })
  });
  const result = await res.json();
  return result?.data?.show;
}

// 2. ดึงซีรีส์ตาม Tag / หมวดหมู่ / URL
async function handleFetchSeriesByTag() {
  const input = document.getElementById("sTagValue").value.trim();
  if (!input) return alert("กรุณาใส่ URL หรือหมวดหมู่");

  showLoader(true);
  try {
    const urlObj = parseUrl(input);
    let type = "serie-tag";
    let val = input;

    if (urlObj) {
      type = urlObj.searchParams.get("type") || "serie-tag";
      val = decodeURIComponent(urlObj.searchParams.get("value") || "");
    }

    // สร้างเงื่อนไข Where ให้ตรงกับ GraphQL Schema ของระบบซีรีส์
    let whereCondition = {};
    if (type === "content") {
      whereCondition = {}; // ดึงซีรีส์ทั้งหมด
    } else if (type === "serie-genre") {
      whereCondition = { genres: { some: { name: { equals: val } } } };
    } else {
      // serie-tag หรืออื่นๆ
      whereCondition = { tags: { some: { name: { equals: val } } } };
    }

    const query = `
      query getShows($skip: Int!, $take: Int!, $where: ShowWhereInput) {
        shows(skip: $skip, take: $take, where: $where, orderBy: {createdAt: desc}) {
          items {
            id
            titleTh
            titleEn
            posterUrl
          }
        }
      }
    `;

    const res = await fetch('https://api.doo-nang.com/graphql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, operationName: 'getShows', variables: { skip: 0, take: 30, where: whereCondition } })
    });

    const data = await res.json();
    const shows = data?.data?.shows?.items || [];

    if (shows.length === 0) {
      throw new Error("ไม่พบรายการซีรีส์ในหมวดหมู่นี้");
    }

    // ดึงข้อมูล Episodes รายเรื่องแบบละเอียดเพื่อเอาลิงก์ วิดีโอ
    const fullSeriesList = [];
    for (const item of shows) {
      const detailedShow = await fetchSeriesById(item.id);
      if (detailedShow && detailedShow.episodes) {
        fullSeriesList.push(detailedShow);
      }
    }

    renderSeriesResult(fullSeriesList, `Series_${val || 'List'}`);
  } catch (e) {
    alert(e.message || "เกิดข้อผิดพลาดในการดึงข้อมูล");
  } finally {
    showLoader(false);
  }
}

// 3. ฟังก์ชันสร้าง M3U สำหรับซีรีส์
function renderSeriesResult(shows, filename) {
  let m3u = "#EXTM3U\n";
  const jsonList = [];

  shows.forEach(show => {
    const showTitle = show.titleTh || show.titleEn;
    const logo = show.posterUrl || "";

    (show.episodes || []).forEach(ep => {
      const uuid = ep.video?.transcodeUuid;
      if (uuid) {
        const playUrl = `https://api.doo-nang.com/video/${uuid}/playlist.m3u8`;
        const sNo = String(ep.seasonNo || 1).padStart(2, '0');
        const eNo = String(ep.episodeNo || 1).padStart(2, '0');
        const epTitle = ep.titleTh || ep.titleEn || `EP${ep.episodeNo}`;

        m3u += `#EXTINF:-1 type="series" group-title="${showTitle}" tvg-logo="${logo}" tvg-season="${ep.seasonNo || 1}" tvg-episode="${ep.episodeNo}", ${showTitle} S${sNo}E${eNo} - ${epTitle}\n`;
        m3u += `${playUrl}\n`;

        jsonList.push({
          showId: show.id,
          showTitle,
          season: ep.seasonNo || 1,
          episode: ep.episodeNo,
          epTitle,
          playlist: playUrl
        });
      }
    });
  });

  document.getElementById("m3uOutput").textContent = m3u;
  document.getElementById("jsonOutput").textContent = JSON.stringify(jsonList, null, 2);

  const btn = document.getElementById("downloadBtn");
  btn.style.display = "block";
  btn.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([m3u], { type: 'text/plain' }));
    a.download = `${filename.replace(/\s+/g, '_')}.m3u`;
    a.click();
  };

  document.getElementById("resultArea").style.display = "block";
}

async function handleFetchSeriesById() {
  const id = document.getElementById("showId").value;
  if (!id) return alert("กรุณาใส่ Show ID");
  showLoader(true);
  try {
    const show = await fetchSeriesById(id);
    if (!show) throw new Error("ไม่พบซีรีส์ ID นี้");
    renderSeriesResult([show], `Series_${id}`);
  } catch (e) {
    alert(e.message);
  } finally {
    showLoader(false);
  }
}

function showLoader(s) {
  document.getElementById("loader").style.display = s ? "block" : "none";
  if (s) document.getElementById("resultArea").style.display = "none";
}
</script>
</body>
</html>
